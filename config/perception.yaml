# Fake "YOLO" bounding-box publisher. No neural network: boxes are computed
# exactly from MuJoCo's segmentation render (so occluded cones are handled),
# then optionally degraded with noise to look like a real detector.
bbox:
  min_visible_pixels: 25      # cones with fewer visible pixels are not reported
  min_box_height_px: 6        # tiny far-away boxes are dropped
  max_range_m: 60.0           # cones farther than this from the camera are dropped

  # Detector-noise model (all 0 = perfect ground truth).
  center_jitter_px: 0.0       # std-dev of Gaussian noise on box centre
  size_jitter_frac: 0.0       # std-dev of relative noise on box width/height
  dropout_prob: 0.0           # probability a visible cone is missed in a frame
  latency_ms: 0               # boxes are stamped with the image time but published this much later

  # outline_color (RGB, 0-1) per cone class. These MUST satisfy the colour
  # thresholds in Monocular-Depth-perception-for-Cones/cone_base_detector.cpp:
  #   orange r>0.5 g<0.3 b<0.3 | blue r<0.3 g<0.3 b>0.5 | yellow r>0.5 g>0.5 b<0.3
  outline_colors:
    blue:       [0.0, 0.0, 1.0]
    yellow:     [1.0, 1.0, 0.0]
    orange:     [1.0, 0.2, 0.0]
    orange_big: [1.0, 0.2, 0.0]

# Rendering / simulation extras (added by the render module).
render:
  msaa_samples: null          # RGB anti-aliasing samples (0/2/4/8); null = use the scene XML value.
                              # Lower (0) is much faster on weak GPUs; segmentation is never multisampled.
  seg_scale: 1.0              # C++ node only: segmentation resolution factor (0.5 = half res,
                              # ~4x cheaper; boxes are scaled back, error <= ~1 px)

seed: 0                       # RNG seed for bbox noise/dropout (override with the ~seed ROS param)

ros:
  frame_id: front_cam_optical

  # The two main outputs.
  publish_raw: true
  image_topic: /camera/image_raw                    # sensor_msgs/Image (rgb8)
  publish_compressed: true
  compressed_topic: /camera/image_raw/compressed    # sensor_msgs/CompressedImage (jpeg)
  bbox_topic: /camera/bounding_boxes                # foxglove_msgs/ImageMarkerArray

  # Optional ground-truth extras (off by default; the car has only a camera).
  publish_odom: true                                # publish nav_msgs/Odometry
  odom_topic: /slam/state                           # nav_msgs/Odometry topic
  publish_imu: true                                 # publish sensor_msgs/Imu
  imu_topic: /zed2/zed_node/imu/data                # sensor_msgs/Imu topic
  imu_frame_id: base_link                           # frame_id for IMU messages

  realtime_factor: 1.0        # 1.0 = real time, 0.5 = half speed
  publish_clock: false        # publish /clock (sim time) for use_sim_time setups

  # C++ node only. realtime: frames paced on the wall clock, dropped (with a warning) if the
  # machine can't keep up. lockstep: publishes /clock and never drops - sim time advances exactly
  # 1/fps per frame, however long rendering takes (use with /use_sim_time:=true).
  time_mode: realtime         # realtime | lockstep
