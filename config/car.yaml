# Formula-style car: body geometry and how it drives around the track.
car:
  # Geometry (metres), roughly a Formula Student car
  length: 2.9
  width: 1.4
  wheelbase: 1.55
  track_width: 1.2
  wheel_radius: 0.23
  wheel_width: 0.20
  body_color: [0.85, 0.10, 0.10, 1.0]
  accent_color: [0.95, 0.95, 0.95, 1.0]   # wing flaps, shoulders
  helmet_color: [0.95, 0.80, 0.10, 1.0]
  camera_housing: true      # small camera box + mast behind the camera plane (never in the image)

  # Driving: the car follows the track centreline kinematically (no tyre physics).
  driver:
    speed_mps: 8.0            # constant target speed
    lateral_offset_m: 0.0     # drive this far left (+) of the centreline
    lookahead_m: 4.0          # heading = chord over this window centred on the car (smooth pure-pursuit-like)
    start_s_m: 0.0            # start this far along the centreline from the start line
    centerline_smoothing_m: 0.0  # gaussian smoothing of the resampled centreline (0 = off)
    # Optional curvature-limited speed profile: v(s) = min(speed_mps, sqrt(a_lat / |curvature|)),
    # then forward/backward passes limited by max_accel / max_brake. null = constant speed.
    max_lateral_accel_mps2: null
    max_accel_mps2: 4.0
    max_brake_mps2: 6.0

  # Optional body motion so the camera is not perfectly stable
  # (exercises IMU tilt correction in the depth pipeline).
  body_motion:
    pitch_amplitude_deg: 0.0
    roll_amplitude_deg: 0.0
    frequency_hz: 1.5

  # Optional tilt model: simulates realistic body pitch/roll from accelerations
  # Typical FS-car values; assumes suspension stiffness/damping from car dynamics.
  # If enabled, kinematic_columns() adds pitch/roll computed from longitudinal/lateral acceleration
  # through a 2nd-order critically-/under-damped filter, plus IMU-frame accelerations (ax, ay, az)
  # and angular velocities (wx, wy, wz).
  tilt_model:
    enabled: false
    pitch_deg_per_g: 0.6      # nose-down tilt per unit braking deceleration
    roll_deg_per_g: 1.0       # outboard roll per unit lateral acceleration
    natural_freq_hz: 2.5      # suspension resonance
    damping: 0.7              # fraction of critical damping (0.7 = slightly underdamped)
